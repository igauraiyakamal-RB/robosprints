<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Manager Login | RoboSprints</title><style>body{font-family:Arial;background:#f5f7f1;color:#102725;margin:0}main{max-width:480px;margin:50px auto;padding:20px}.card{background:white;padding:28px;border:1px solid #dce8df;border-radius:16px}.hidden{display:none}input{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box;border:1px solid #ccd8d0;border-radius:8px}button{padding:12px 16px;border:0;border-radius:22px;background:#c5f36a;font-weight:bold;margin:4px}.muted{background:#edf2ed}.msg{padding:10px;border-radius:8px;margin:10px 0}.error{background:#ffe8e8}.ok{background:#edfae2}.note{font-size:13px;color:#667}</style></head><body><main><section class="card" id="login"><small>SECURE MANAGER ACCESS</small><h1>Project Manager</h1><p class="note">Password + Email OTP are mandatory for every login.</p><div id="msg"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><button onclick="start()">Continue & Send OTP</button><div id="otpArea" class="hidden"><label>Email OTP</label><input id="otp" inputmode="numeric" placeholder="Enter OTP"><button onclick="verify()">Verify OTP & Login</button></div><p><button class="muted" onclick="view('signup')">Sign Up</button><button class="muted" onclick="view('forgot')">Forgot Password?</button></p></section><section class="card hidden" id="signup"><h2>New Project Manager Registration</h2><p class="note">New Manager accounts require Admin approval.</p><div id="smsg"></div><label>Full name</label><input id="name"><label>Email</label><input id="semail" type="email"><label>Password</label><input id="spass" type="password"><button onclick="signup()">Submit Registration</button><button class="muted" onclick="view('login')">Back</button></section><section class="card hidden" id="forgot"><h2>Reset Password</h2><div id="fmsg"></div><input id="femail" type="email" placeholder="Registered email"><button onclick="forgot()">Send Reset Email</button><button class="muted" onclick="view('login')">Back</button></section></main><script>const SB='https://ymndslqkhuubgoxxkuei.supabase.co',KEY='sb_publishable_u9d-jX_yxaofcUIw1Ou6lg__GaE3sPa',ROLE='project_manager',DASH='/project-manager-dashboard.html';let email='';const $=id=>document.getElementById(id);function view(id){['login','signup','forgot'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function say(id,t,k=''){let e=$(id);e.textContent=t;e.className='msg '+k}async function post(path,body){let r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Request failed');return d}async function check(d){let r=await fetch(SB+'/rest/v1/user_profiles?select=role,approval_status&id=eq.'+d.user.id,{headers:{apikey:KEY,Authorization:'Bearer '+d.access_token}}),p=(await r.json())[0];if(!p||p.role!==ROLE)throw Error('This account is not registered as Project Manager.');if(p.approval_status!=='approved')throw Error('Your registration is awaiting Admin approval.');}async function start(){try{email=$('email').value.trim();let password=$('pass').value;if(!email||!password)throw Error('Enter email and password.');let d=await post('/auth/v1/token?grant_type=password',{email,password});await check(d);await post('/auth/v1/otp',{email,create_user:false});$('otpArea').classList.remove('hidden');say('msg','Password verified. Email OTP sent.','ok')}catch(e){say('msg',e.message,'error')}}async function verify(){try{let d=await post('/auth/v1/verify',{email,token:$('otp').value.trim(),type:'email'});await check(d);sessionStorage.setItem('robosprints_manager_token',d.access_token);sessionStorage.setItem('robosprints_manager_role',ROLE);location.href=DASH}catch(e){say('msg',e.message,'error')}}async function signup(){try{let name=$('name').value.trim(),e=$('semail').value.trim(),password=$('spass').value;if(!name||!e||password.length<6)throw Error('Enter name, email and a password of at least 6 characters.');await post('/auth/v1/signup',{email:e,password,data:{full_name:name,requested_role:ROLE}});say('smsg','Registration submitted. Please wait for Admin approval.','ok')}catch(e){say('smsg',e.message,'error')}}async function forgot(){try{let e=$('femail').value.trim();if(!e)throw Error('Enter your registered email.');await post('/auth/v1/recover',{email:e,options:{redirectTo:location.origin+'/reset-password.html'}});say('fmsg','Password reset email sent.','ok')}catch(e){say('fmsg',e.message,'error')}}</script></body></html>

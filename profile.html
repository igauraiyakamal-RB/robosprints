<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | RoboSprints</title><style>:root{--ink:#26321f;--accent:#6f7f3a;--paper:#faf8f0;--line:#ddd8c8}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:var(--paper);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:15px 6%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px}.brand span{color:var(--accent)}main{max-width:760px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #cfc9b7;border-radius:8px;font:inherit}button{margin-top:20px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.note{padding:10px;border-radius:8px;margin:10px 0}.ok{background:#e7f3e2}.error{background:#fae7e4;color:#8d2920}.readonly{background:#f3f1ea}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">Robo<span>Sprints</span></div><a href="/">Home</a></header><main><div class="card"><h1>My Profile</h1><p>Keep your details up to date. Your profile helps RoboSprints personalise your learning journey and identify your account securely.</p><div id="msg"></div><div class="grid"><div><label>Full Name *</label><input id="full_name"></div><div><label>Email ID</label><input id="email" class="readonly" readonly></div><div><label>Mobile Number *</label><input id="phone" type="tel"></div><div><label>WhatsApp Number</label><input id="whatsapp_no" type="tel"></div><div><label>School Name</label><input id="school_name"></div><div><label>School Code (if available)</label><input id="school_code"></div></div><label>Address Line 1</label><input id="address_line1"><label>Address Line 2</label><input id="address_line2"><div class="grid"><div><label>City</label><input id="city"></div><div><label>State</label><input id="state"></div><div><label>Postal / PIN Code</label><input id="postal_code"></div><div><label>Country</label><input id="country" value="India"></div></div><p id="roleText"></p><button id="save">Save My Profile</button></div></main><script>const SB='https://ymndslqkhuubgoxxkuei.supabase.co',KEY='sb_publishable_u9d-jX_yxaofcUIw1Ou6lg__GaE3sPa';let token,user;const ids=['full_name','phone','whatsapp_no','school_name','school_code','address_line1','address_line2','city','state','postal_code','country'];const msg=(t,e=false)=>{const x=document.getElementById('msg');x.className='note '+(e?'error':'ok');x.textContent=t};async function api(path,opt={}){const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw Error((d&&d.message)||t);return d}async function load(){token=localStorage.getItem('robosprints_session_token')||sessionStorage.getItem('robosprints_session_token')||sessionStorage.getItem('robosprints_mentor_token');if(!token){location.href='/login.html';return}try{user=await api('/auth/v1/user');document.getElementById('email').value=user.email||'';const rows=await api('/rest/v1/user_profiles?select=*&id=eq.'+user.id);const p=rows[0]||{};ids.forEach(id=>document.getElementById(id).value=p[id]||document.getElementById(id).value||'');document.getElementById('roleText').textContent='Account role: '+(p.role||'Member')+(p.approval_status?' · Status: '+p.approval_status:'')}catch(e){msg('Unable to load profile: '+e.message,true)}}document.getElementById('save').onclick=async()=>{try{const body={email:user.email,profile_completed:true,updated_at:new Date().toISOString()};ids.forEach(id=>body[id]=document.getElementById(id).value.trim()||null);if(!body.full_name||!body.phone)throw Error('Full name and mobile number are required.');await api('/rest/v1/user_profiles?id=eq.'+user.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});localStorage.setItem('robosprints_profile_name',body.full_name);msg('Your profile has been saved successfully.')}catch(e){msg(e.message,true)}};load();</script></body></html>

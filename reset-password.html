<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | RoboSprints</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#08284b}.box{max-width:460px;margin:70px auto;background:#fff;padding:32px;border:1px solid #dce5ef;border-radius:18px;box-shadow:0 8px 24px #17345a0a}label{display:block;font-weight:bold;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd7e4;border-radius:9px;font-size:16px}button{margin-top:20px;background:#315eea;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:bold;cursor:pointer}.msg{margin:15px 0;padding:12px;border-radius:9px;background:#eef3f8}.error{background:#ffeaea;color:#a21d1d}.ok{background:#edfae2;color:#285a13}a{color:#315eea;font-weight:bold}</style></head><body><main class="box"><h1>Create a new password</h1><p>Please choose a new secure password for your RoboSprints account.</p><div id="msg"></div><label>New password</label><input id="password" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="confirm" type="password" autocomplete="new-password"><button id="save">Update Password</button><p><a href="/mentor.html">← Back to Mentor Login</a></p></main><script>const SB='https://ymndslqkhuubgoxxkuei.supabase.co',KEY='sb_publishable_u9d-jX_yxaofcUIw1Ou6lg__GaE3sPa';const m=document.getElementById('msg'),msg=(t,c='')=>{m.className='msg '+c;m.textContent=t};const h=new URLSearchParams(location.hash.slice(1)),token=h.get('access_token');if(!token)msg('This password reset link is invalid or has expired. Please request a new password reset link.','error');document.getElementById('save').onclick=async()=>{try{const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(!token)throw Error('Please request a new password reset link.');if(p.length<6)throw Error('Password must be at least 6 characters.');if(p!==c)throw Error('Passwords do not match.');const r=await fetch(SB+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Unable to update password.');msg('Password updated successfully. You can now sign in to your Mentor account.','ok');history.replaceState(null,'',location.pathname)}catch(e){msg(e.message,'error')}}</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboSprints Admin</title><style>body{margin:0;font-family:Arial;background:#f5f8fc;color:#08284b}.wrap{max-width:960px;margin:40px auto;padding:20px}.box{background:white;border:1px solid #dce5ef;border-radius:16px;padding:28px;margin-bottom:20px}.login{max-width:460px;margin:50px auto}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;border:1px solid #cbd7e4;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#315eea;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#edf1f6;color:#08284b}.approve{background:#268a3d}.reject{background:#fff0f0;color:#a21d1d}.hidden{display:none}.msg{padding:11px;margin:10px 0;border-radius:8px;background:#eef3f8}.error{background:#ffeaea;color:#a21d1d}.ok{background:#edfae2;color:#285a13}.request{padding:16px;border:1px solid #dce5ef;border-radius:12px;margin:12px 0}.meta{color:#60758f}</style></head><body><main class="wrap"><section id="loginBox" class="box login"><h1>RoboSprints Admin</h1><p>Secure access for account approvals and platform control.</p><div id="loginMsg"></div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login">Login</button><p><button id="forgot" class="secondary" type="button">Forgot Password?</button></p><a href="/">← Back to website</a></section><section id="forgotBox" class="box login hidden"><h2>Reset Admin Password</h2><p>Enter your Admin email. We will send a secure password reset link.</p><div id="forgotMsg"></div><label>Email</label><input id="forgotEmail" type="email"><button id="sendReset">Send Reset Link</button> <button id="back" class="secondary">Back</button></section><section id="resetBox" class="box login hidden"><h2>Create New Password</h2><div id="resetMsg"></div><label>New password</label><input id="newPassword" type="password"><label>Confirm password</label><input id="confirmPassword" type="password"><button id="savePassword">Update Password</button></section><section id="dash" class="hidden"><div class="box"><h1>Admin Approval Centre</h1><p>Approve Mentor and Project Manager registration requests.</p><div id="msg"></div><button id="refresh" class="secondary">Refresh Requests</button><button id="logout" class="secondary">Logout</button><div id="requests">Loading…</div></div></section></main><script>
const SB='https://ymndslqkhuubgoxxkuei.supabase.co',KEY='sb_publishable_u9d-jX_yxaofcUIw1Ou6lg__GaE3sPa';let token='';const $=id=>document.getElementById(id);function say(id,t,type=''){const e=$(id);e.className='msg '+type;e.textContent=t}function show(id){['loginBox','forgotBox','resetBox','dash'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
async function auth(path,body){const r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'Request failed');return d}
async function api(path,opt={}){const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error((await r.text())||'Request failed');return r.status===204?null:r.json()}
$('forgot').onclick=()=>show('forgotBox');$('back').onclick=()=>show('loginBox');
$('sendReset').onclick=async()=>{try{const email=$('forgotEmail').value.trim();if(!email)throw Error('Please enter your email.');await auth('/auth/v1/recover',{email,options:{redirectTo:'https://robosprints.in/admin.html'}});say('forgotMsg','If this is a registered Admin email, a secure password reset link has been sent.','ok')}catch(e){say('forgotMsg',e.message,'error')}}
$('login').onclick=async()=>{try{say('loginMsg','Signing in…');const d=await auth('/auth/v1/token?grant_type=password',{email:$('email').value.trim(),password:$('password').value});token=d.access_token;const me=await api('/rest/v1/user_profiles?select=role,approval_status&id=eq.'+d.user.id);if(!me[0]||me[0].role!=='admin'||me[0].approval_status!=='approved')throw Error('This account is not an approved Admin account.');show('dash');load()}catch(e){say('loginMsg',e.message,'error')}}
function recovery(){const h=new URLSearchParams(location.hash.slice(1));return h.get('type')==='recovery'&&h.get('access_token')}if(recovery()){token=new URLSearchParams(location.hash.slice(1)).get('access_token');show('resetBox')}
$('savePassword').onclick=async()=>{try{const p=$('newPassword').value;if(p.length<6)throw Error('Password must be at least 6 characters.');if(p!==$('confirmPassword').value)throw Error('Passwords do not match.');const r=await fetch(SB+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok)throw Error((await r.text())||'Password update failed');say('resetMsg','Password updated successfully. You can now log in.','ok');setTimeout(()=>{history.replaceState(null,'',location.pathname);show('loginBox')},1200)}catch(e){say('resetMsg',e.message,'error')}}
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const rows=await api('/rest/v1/user_profiles?select=id,full_name,email,phone,requested_role,created_at&approval_status=eq.pending&requested_role=in.(mentor,project_manager)&order=created_at.desc');$('requests').innerHTML=rows.length?rows.map(x=>'<div class="request"><b>'+esc(x.full_name)+'</b><div class="meta">'+esc(x.email)+' · '+esc(x.phone||'')+'</div><p>Requested role: <b>'+esc(x.requested_role).replace('_',' ')+'</b></p><button class="approve" data-a="'+x.id+'">Approve</button> <button class="reject" data-r="'+x.id+'">Reject</button></div>').join(''):'<p class="meta">No pending requests.</p>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>decide(b.dataset.a,true));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>decide(b.dataset.r,false))}catch(e){say('msg',e.message,'error')}}
async function decide(id,ok){try{const rows=await api('/rest/v1/user_profiles?select=requested_role&id=eq.'+id);const body=ok?{role:rows[0].requested_role,requested_role:null,approval_status:'approved'}:{approval_status:'rejected'};await api('/rest/v1/user_profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});say('msg',ok?'Account approved successfully.':'Request rejected.','ok');load()}catch(e){say('msg',e.message,'error')}}
$('refresh').onclick=load;$('logout').onclick=()=>{token='';show('loginBox')};
</script></body></html>

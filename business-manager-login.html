<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Manager | RoboSprints</title><style>body{font-family:Arial;background:#f5f7f1;color:#102725}main{max-width:460px;margin:50px auto;background:#fff;padding:28px;border-radius:16px}input{width:100%;padding:11px;margin:6px 0 12px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:20px;background:#c5f36a;font-weight:bold;margin:4px}.hidden{display:none}.msg{padding:10px;margin:8px 0}.error{background:#ffe8e8}.ok{background:#edfae2}</style></head><body><main><div id="login"><h1>Business Manager Login</h1><p>Password + Email OTP are mandatory on every access.</p><div id="msg"></div><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="start()">Continue & Send OTP</button><div id="otpbox" class="hidden"><input id="otp" placeholder="Email OTP"><button onclick="verify()">Verify OTP & Login</button></div><p><button onclick="show('signup')">Sign Up</button><button onclick="show('forgot')">Forgot Password?</button></p></div><div id="signup" class="hidden"><h2>New Registration</h2><p>New accounts require Admin approval.</p><div id="smsg"></div><input id="name" placeholder="Full name"><input id="semail" type="email" placeholder="Email"><input id="spass" type="password" placeholder="Create password"><button onclick="signup()">Submit Registration</button><button onclick="show('login')">Back</button></div><div id="forgot" class="hidden"><h2>Reset Password</h2><div id="fmsg"></div><input id="femail" type="email" placeholder="Registered email"><button onclick="reset()">Send Reset Email</button><button onclick="show('login')">Back</button></div></main><script>const SB='https://ymndslqkhuubgoxxkuei.supabase.co',KEY='sb_publishable_u9d-jX_yxaofcUIw1Ou6lg__GaE3sPa',ROLE='business_manager',DASH='/marketing-manager.html';let E='';const $=x=>document.getElementById(x);function show(x){['login','signup','forgot'].forEach(i=>$(i).className=i===x?'':'hidden')}function say(i,t,c=''){let e=$(i);e.textContent=t;e.className='msg '+c}async function post(p,b){let r=await fetch(SB+p,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Request failed');return d}async function check(d){let r=await fetch(SB+'/rest/v1/user_profiles?select=role,approval_status&id=eq.'+d.user.id,{headers:{apikey:KEY,Authorization:'Bearer '+d.access_token}}),p=(await r.json())[0];if(!p||p.role!==ROLE)throw Error('Incorrect role for this login.');if(p.approval_status!=='approved')throw Error('Account awaiting Admin approval.')}async function start(){try{E=$('email').value.trim();let d=await post('/auth/v1/token?grant_type=password',{email:E,password:$('pass').value});await check(d);await post('/auth/v1/otp',{email:E,create_user:false});$('otpbox').classList.remove('hidden');say('msg','Password verified. OTP sent.','ok')}catch(e){say('msg',e.message,'error')}}async function verify(){try{let d=await post('/auth/v1/verify',{email:E,token:$('otp').value.trim(),type:'email'});await check(d);sessionStorage.setItem('robosprints_manager_token',d.access_token);sessionStorage.setItem('robosprints_manager_role',ROLE);location.href=DASH}catch(e){say('msg',e.message,'error')}}async function signup(){try{await post('/auth/v1/signup',{email:$('semail').value.trim(),password:$('spass').value,data:{full_name:$('name').value.trim(),requested_role:ROLE}});say('smsg','Registration submitted for Admin approval.','ok')}catch(e){say('smsg',e.message,'error')}}async function reset(){try{await post('/auth/v1/recover',{email:$('femail').value.trim(),options:{redirectTo:location.origin+'/reset-password.html'}});say('fmsg','Reset email sent.','ok')}catch(e){say('fmsg',e.message,'error')}}</script></body></html>

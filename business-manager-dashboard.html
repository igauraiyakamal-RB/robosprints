<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Manager | RoboSprints</title><style>body{font-family:Arial;margin:0;background:#f4f7f5;color:#102725}header,main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:14px;margin:14px 0;border:1px solid #dfe7e2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{font-size:28px;font-weight:bold}button{background:#315eea;color:#fff;border:0;padding:9px 12px;border-radius:8px;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>🤖 RoboSprints</b> · Business Manager Dashboard</header><main><h2>Real Business Collections</h2><div class="grid" id="kpis"></div><div class="card"><h3>Commercial Control</h3><p>Review and approve Purchase Manager pricing proposals. Only approved prices should become live for future student orders.</p><div id="approvals">Loading pricing proposals…</div></div><div class="card"><h3>Recent Parts Orders</h3><div id="orders"></div></div></main><script>function token(){return localStorage.student_session_token||sessionStorage.student_session_token||localStorage.robosprints_session_token||sessionStorage.robosprints_session_token||''}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token(),...(opt.headers||{})}}),x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}async function load(){try{const a=await api('/api/student-profile?scope=analytics');const s=a.summary;kpis.innerHTML=[['Membership Collection',s.membership_collection],['Parts Collection',s.parts_collection],['Total Gross Collection',s.total_gross_collection],['Parts Orders',s.parts_order_count],['Estimated Parts Cost',s.estimated_parts_cost],['Estimated Parts Gross Profit',s.estimated_parts_gross_profit]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="kpi">'+(x[0].includes('Orders')?x[1]:'₹'+Number(x[1]||0).toFixed(0))+'</div></div>').join('');orders.innerHTML=a.orders.map(o=>'<p><b>'+o.id+'</b> · ₹'+o.total+' · '+o.status+'</p>').join('')||'No paid parts orders yet.';const p=await api('/api/student-profile?scope=parts');approvals.innerHTML='Approved parts currently visible: '+p.parts.length+'. Pending proposals remain under Business Manager approval workflow.'}catch(e){document.body.insertAdjacentHTML('beforeend','<p style="padding:18px;color:#b00">'+e.message+'</p>')}}load();</script></body></html>

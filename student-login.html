<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | RoboSprints</title><style>body{margin:0;font-family:Arial;background:#f5f7f1;color:#19302d}.w{max-width:480px;margin:auto;padding:32px 20px}.brand{font-size:25px;font-weight:900;color:#102725;text-decoration:none}.brand span{color:#3862ee}.card{margin-top:40px;background:#fff;border:1px solid #dfe8df;border-radius:20px;padding:28px}h1{margin:0 0 8px}p{color:#657572;line-height:1.6}label{font-weight:bold;font-size:13px;display:block;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d5e0d7;border-radius:10px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:25px;background:#c5f36a;font-weight:bold}.hidden{display:none}.msg{font-size:13px;margin-top:14px}.error{color:#b42318}.ok{color:#26734d}.back{display:block;margin-top:20px;text-align:center;color:#416653}</style></head><body><main class="w"><a class="brand" href="/">🤖 Robo<span>Sprints</span></a><section class="card"><h1>Welcome back</h1><p>Enter the email used for your membership. We'll send a one-time code to securely continue your saved learning journey.</p><form id="a"><label>Email address</label><input id="email" type="email" required><button>Send login code</button></form><form id="b" class="hidden"><label>Verification code</label><input id="token" required inputmode="numeric" autocomplete="one-time-code"><button>Continue my journey</button></form><div id="msg" class="msg"></div><a class="back" href="/">← Back to RoboSprints</a></section></main><script>let email='';const M=document.getElementById('msg'),say=(t,c='')=>{M.textContent=t;M.className='msg '+c};a.onsubmit=async e=>{e.preventDefault();email=document.getElementById('email').value.trim().toLowerCase();say('Sending your secure login code…');let r=await fetch('/api/student-login-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}),d=await r.json();if(!r.ok)return say(d.error,'error');a.classList.add('hidden');b.classList.remove('hidden');say('✓ Code sent. Check your email.','ok')};b.onsubmit=async e=>{e.preventDefault();say('Checking your membership…');let r=await fetch('/api/student-login-verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,token:document.getElementById('token').value.trim()})}),d=await r.json();if(!r.ok)return say(d.error,'error');if(d.access_token){localStorage.setItem('robosprints_session_token',d.access_token);sessionStorage.setItem('robosprints_session_token',d.access_token);localStorage.setItem('student_session_token',d.access_token);sessionStorage.setItem('student_session_token',d.access_token);const savedName=d.full_name||d.name||(email?email.split('@')[0]:'Student');localStorage.setItem('robosprints_profile_name',savedName);localStorage.setItem('robosprints_student_name',savedName)}say('✓ Membership found. Opening your journey…','ok');setTimeout(()=>location.href=d.journey_url,500)};</script></body></html>
